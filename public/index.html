<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Gestión de tareas</title>

  <link rel="stylesheet" href="styles.css">

  <script src="/socket.io/socket.io.js" defer></script>

  <script src="app.js" defer></script>
</head>

<body>

  <main class="container">

    <header class="header">

      <div>
        <h1>Gestionador de tareas</h1>

        <p>Administrador de actividades</p>
      </div>

      <span id="connection" class="connection">
        A la espera
      </span>

    </header>

    <!-- Inicio de Sesión -->

    <section id="login" class="panel">

      <h2>Iniciar sesión</h2>

      <p>Usuario: administrador</p>
      <p>Contraseña: demo012</p>

      <form id="login-form">

        <input
          type="text"
          name="username"
          placeholder="Usuario"
          value="administrador"
          required
        >

        <input
          type="password"
          name="password"
          placeholder="Contraseña"
          value="demo012"
          required
        >

        <button type="submit">
          Ingresar
        </button>

      </form>

      <p id="login-error" class="message"></p>

    </section>

    <!-- Panel Principal -->

    <section id="workspace" hidden>

      <div class="toolbar">

        <h2>Mis tareas</h2>

        <button id="logout" class="secondary">
          Cerrar sesión
        </button>

      </div>

      <!-- Creación de Tareas -->

      <form id="task-form" class="panel">

        <h3>Nueva tarea</h3>

        <input
          type="text"
          name="title"
          placeholder="Título de la tarea"
          maxlength="120"
          required
        >

        <textarea
          name="description"
          placeholder="Descripción"
          maxlength="2000"
        ></textarea>

        <div class="fields">

          <select name="status">

            <option value="pendiente">
              Pendiente
            </option>

            <option value="en_progreso">
              En progreso
            </option>

            <option value="completada">
              Completada
            </option>

          </select>

          <input
            type="date"
            name="due_date"
          >

        </div>

        <button type="submit">
          Crear tarea
        </button>

      </form>

      <!-- Filtrar por categoria -->

      <div class="toolbar">

        <input
          type="search"
          id="search"
          placeholder="Buscar tarea..."
        >

        <select id="filter">

          <option value="">
            Todos los estados
          </option>

          <option value="pendiente">
            Pendientes
          </option>

          <option value="en_progreso">
            En progreso
          </option>

          <option value="completada">
            Completadas
          </option>

        </select>

      </div>

      <p id="message" class="message"></p>

      <!-- Listado -->

      <div id="tasks" class="tasks"></div>

    </section>

  </main>

</body>
</html>
